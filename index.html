
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Batch Placeholder Generator</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 2em auto;
      text-align: center;
    }
    .drop-zone {
      border: 2px dashed #ccc;
      padding: 2em;
      margin: 1em 0;
      cursor: pointer;
    }
    .drop-zone.dragover {
      background: #f9f9f9;
    }
    fieldset {
      border: none;
      margin: 1em 0;
    }
    ul {
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>Batch Placeholder Generator</h1>
  <p>Drag &amp; drop your images here, or click to select:</p>

  <div class="drop-zone" id="dropZone">
    Drop images here<br>or<br>
    <input type="file" id="fileInput" multiple accept="image/*">
  </div>

  <fieldset>
    <legend>Fill with:</legend>
    <label>
      <input type="radio" name="fill" value="transparent-png" checked>
      Transparent (PNG) + White (JPEG)
    </label><br>
    <label>
      <input type="radio" name="fill" value="white-all">
      White (all types)
    </label>
  </fieldset>

  <button id="processBtn">Generate ZIP</button>

  <h3>Log / Download</h3>
  <ul id="log"></ul>

  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
          integrity="sha512-...==" crossorigin="anonymous"></script>

  <script>
    const dropZone   = document.getElementById('dropZone');
    const fileInput  = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const logList    = document.getElementById('log');
    let files = [];

    // Drag & drop events
    ['dragenter','dragover'].forEach(evt =>
      dropZone.addEventListener(evt, e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      })
    );
    ['dragleave','drop'].forEach(evt =>
      dropZone.addEventListener(evt, e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      })
    );
    dropZone.addEventListener('drop', e => {
      files = Array.from(e.dataTransfer.files)
                   .filter(f => f.type.startsWith('image/'));
      log(`🖼️ ${files.length} image(s) dropped`);
    });

    // File input
    fileInput.addEventListener('change', e => {
      files = Array.from(e.target.files)
                   .filter(f => f.type.startsWith('image/'));
      log(`🖼️ ${files.length} image(s) selected`);
    });

    // Logging helper
    function log(msg) {
      const li = document.createElement('li');
      li.textContent = msg;
      logList.appendChild(li);
    }

    // Process button
    processBtn.addEventListener('click', async () => {
      if (!files.length) {
        return alert('Please select at least one image.');
      }

      const fillMode = document.querySelector('input[name="fill"]:checked').value;
      const zip = new JSZip();

      for (const file of files) {
        await new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');

            const ext  = file.name.split('.').pop().toLowerCase();
            const mime = (ext === 'jpg' || ext === 'jpeg')
                          ? 'image/jpeg'
                          : 'image/png';

            // Decide fill
            if (
              fillMode === 'white-all' ||
              (fillMode === 'transparent-png' && mime === 'image/jpeg')
            ) {
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, w, h);
            }
            // else: transparent for PNG in transparent-png mode

            canvas.toBlob(blob => {
              zip.file(file.name, blob);
              log(`✅ Processed ${file.name}`);
              resolve();
            }, mime);
          };
          img.onerror = () => {
            log(`⚠️ Error loading ${file.name}`);
            resolve();
          };
          img.src = URL.createObjectURL(file);
        });
      }

      log('📦 Generating ZIP…');
      const content = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      a.download = 'placeholders.zip';
      a.textContent = '⬇️ Download placeholders.zip';
      const li = document.createElement('li');
      li.appendChild(a);
      logList.appendChild(li);
    });
  </script>
</body>
</html>
